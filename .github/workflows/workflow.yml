name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'

  pull_request:

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions
      with:
        tags: latest
