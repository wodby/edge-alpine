name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'

  pull_request:

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  TAGS: latest

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Check scanned-image publication
      run: python3 tests/scanned-image-release.py
    - uses: ./.github/actions
    - name: Select built image
      id: build-image
      run: |
        image=$(make --no-print-directory -s image-ref)
        echo "image=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"
    - name: Scan image
      if: github.event_name == 'push'
      uses: ./.github/actions/grype
      with:
        image: docker:${{ steps.build-image.outputs.image }}
        # Preserve the existing policy, including vulnerabilities without a fix.
        only-fixed: 'false'
    - name: Release image
      if: github.event_name == 'push'
      env:
        SCANNED_IMAGE: ${{ steps.build-image.outputs.image }}
      run: ./.github/actions/release.sh
