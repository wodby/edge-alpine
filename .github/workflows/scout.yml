name: Scan published images

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.images.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select latest and current release images
        id: images
        run: |
          tag=$(git tag --sort=-version:refname | sed -nE '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')
          test -n "$tag"
          echo "tags=$(jq -nc --arg tag "$tag" '["latest", $tag]')" >> "$GITHUB_OUTPUT"
  scan:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.setup.outputs.tags) }}
    steps:
      - uses: actions/checkout@v6
      - name: Scan published image
        uses: ./.github/actions/scout
        with:
          image: registry://wodby/edge-alpine:${{ matrix.tag }}
          # The release workflow currently publishes amd64 only.
          platform: linux/amd64
          only-fixed: 'false'
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
